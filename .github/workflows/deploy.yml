name: Production deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  BOT_IMAGE: ghcr.io/siqoramil/logist-uz-bot
  ADMIN_IMAGE: ghcr.io/siqoramil/logist-uz-admin
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish production images
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: telegram-bot
            image: ghcr.io/siqoramil/logist-uz-bot
            cache: bot
          - context: admin
            image: ghcr.io/siqoramil/logist-uz-admin
            cache: admin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.DEPLOY_SHA }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Update production stack
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BOT_IMAGE: ${{ env.BOT_IMAGE }}:${{ env.DEPLOY_SHA }}
          ADMIN_IMAGE: ${{ env.ADMIN_IMAGE }}:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN,BOT_IMAGE,ADMIN_IMAGE
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd telegram-bot
            export BOT_IMAGE ADMIN_IMAGE
            docker compose --env-file .env.production -f docker-compose.yml pull
            docker compose --env-file .env.production -f docker-compose.yml up -d --remove-orphans
            docker compose --env-file .env.production -f docker-compose.yml ps
            docker image prune -f
