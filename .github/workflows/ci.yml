name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: Admin quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: admin/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build

  telegram-bot:
    name: Bot quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: telegram-bot/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn smoke:account
      - run: yarn smoke:multi-account

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [admin, telegram-bot]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: telegram-bot
          push: false
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
      - uses: docker/build-push-action@v6
        with:
          context: admin
          push: false
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
