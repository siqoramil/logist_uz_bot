name: logistic-bot

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-logistic_bot}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    logging: *logging

  bot:
    image: ${BOT_IMAGE:-ghcr.io/siqoramil/logist-uz-bot:latest}
    restart: unless-stopped
    init: true
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --enable-source-maps
      BOT_TOKEN: ${BOT_TOKEN}
      CONTROLLER_USER_ID: ${CONTROLLER_USER_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_ACCOUNT_SESSION: ${TELEGRAM_ACCOUNT_SESSION}
      ACCOUNT_SEND_CONCURRENCY: ${ACCOUNT_SEND_CONCURRENCY:-10}
      ACCOUNT_MAX_FLOOD_WAIT_SECONDS: ${ACCOUNT_MAX_FLOOD_WAIT_SECONDS:-300}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PORT: 3000
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-logistic_bot}?authSource=${MONGO_DB:-logistic_bot}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_BROADCAST_LOCK_TTL_MS: ${REDIS_BROADCAST_LOCK_TTL_MS:-60000}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
    logging: *logging

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/siqoramil/logist-uz-admin:latest}
    restart: unless-stopped
    depends_on:
      bot: { condition: service_healthy }
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    networks: [backend]
    logging: *logging

volumes:
  mongo_data:
  mongo_config:
  redis_data:

networks:
  backend:
    driver: bridge
